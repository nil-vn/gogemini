name: phase4-gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e-artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run critical flows
        run: npm run test:e2e
      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn

  security-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Dependency scan
        run: |
          pip-audit -r requirements/production.txt -f json -o security-depscan.json || true
          govulncheck ./... > security-govulncheck.txt || true
      - name: SAST scan
        run: |
          bandit -r app -f json -o security-bandit.json || true
          staticcheck ./... > security-staticcheck.txt || true
      - name: Security behavior test pack
        run: go test ./internal/http -run 'Test(CSRF|CORS|Session|Injection|XSS|UploadAbuse)' -v | tee security-behavior-tests.txt
      - name: Build security report
        run: python scripts/security/build_security_report.py
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-*.json
            security-*.txt
            docs/reports/security-gate-report.md
          if-no-files-found: warn

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build server
        run: go build -o bin/server ./cmd/server
      - name: Start server
        run: |
          ./bin/server > perf-server.log 2>&1 &
          echo $! > server.pid
          sleep 2
      - name: Perf benchmark + gate
        run: |
          python scripts/perf_baseline.py --pid $(cat server.pid) --requests 300 --concurrency 30 --json-out perf-baseline.json
          python scripts/perf_gate.py --input perf-baseline.json --slo scripts/perf_slo.json --report docs/reports/perf-gate-report.md
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate
          path: |
            perf-baseline.json
            perf-server.log
            docs/reports/perf-gate-report.md
      - name: Cleanup
        if: always()
        run: kill $(cat server.pid) || true
